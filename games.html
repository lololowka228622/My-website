<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Resource Portal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 2.5rem;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            max-width: 450px;
            width: 100%;
            border: 1px solid #334155;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #38bdf8; }
        p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 1.5rem; }
        .launch-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 0.85rem 1.5rem;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .launch-btn:hover { background: #0ea5e9; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Secure Workspace Launcher</h1>
        <p>Click below to initialize the localized game simulator environment safely in an isolated tab.</p>
        <button class="launch-btn" onclick="openCloakedVault()">Launch Workspace</button>
    </div>

    <script>
        function openCloakedVault() {
            let tab = window.open('about:blank', '_blank');
            
            if (!tab) {
                alert("Popup blocked! Please allow popups for this page.");
                return;
            }

            let vaultHTML = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <style>
        :root {
            --bg: #0b0f19;
            --card: #131b2e;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #6366f1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 2rem; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
        h1 { color: var(--accent); font-size: 1.5rem; }
        input { background: var(--card); border: 1px solid #334155; color: var(--text); padding: 0.5rem 1rem; border-radius: 6px; outline: none; width: 250px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; }
        .game-card { background: var(--card); border: 1px solid #1e293b; border-radius: 8px; padding: 1rem; text-align: center; cursor: pointer; transition: transform 0.2s; }
        .game-card:hover { transform: translateY(-3px); border-color: var(--accent); }
        .icon { font-size: 2rem; margin-bottom: 0.5rem; }
        .title { font-weight: 600; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>
    <header>
        <h1>🎮 Arcade Vault (Isolated)</h1>
        <input type="text" id="search" placeholder="Search 200 games..." oninput="filterGames()">
    </header>
    <div class="grid" id="grid"></div>

    <script>
        const extraPrefixes = ["Super", "Cyber", "Mega", "Pixel", "Turbo", "Shadow", "Neon", "Epic", "Retro", "Alpha", "Quantum", "Hyper"];
        const extraSuffixes = ["Quest", "Dash", "Craft", "Run", "Brawler", "Arena", "Strike", "Jump", "Saga", "Defense", "Wars", "Rider"];
        const emojis = ["🎮", "🕹️", "🚀", "👾", "🎯", "⚡", "🔥", "💎", "🛡️", "⚔️", "🌀", "🧩"];
        
        let games = [];
        for(let i=1; i<=200; i++) {
            let p = extraPrefixes[i % extraPrefixes.length];
            let s = extraSuffixes[(i*3) % extraSuffixes.length];
            let e = emojis[i % emojis.length];
            games.push({ title: p + ' ' + s + ' ' + i, icon: e });
        }

        const grid = document.getElementById('grid');
        function render(arr) {
            grid.innerHTML = '';
            arr.forEach(g => {
                let card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = '<div class="icon">' + g.icon + '</div><div class="title">' + g.title + '</div>';
                card.onclick = () => alert('Launching simulation for: ' + g.title);
                grid.appendChild(card);
            });
        }
        function filterGames() {
            let q = document.getElementById('search').value.toLowerCase();
            render(games.filter(g => g.title.toLowerCase().includes(q)));
        }
        render(games);
    <\/script>
</body>
</html>`;

            tab.document.open();
            tab.document.write(vaultHTML);
            tab.document.close();
        }
    </script>
</body>
</html>
